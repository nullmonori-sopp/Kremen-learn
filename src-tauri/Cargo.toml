[package]
name = "kremen-learn"
version = "0.1.0"
description = "An offline programming studio for Kremen"
authors = ["Kremen Learn contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.99"

[lib]
name = "kremen_learn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
libc = "0.2"
rfd = "0.15"
